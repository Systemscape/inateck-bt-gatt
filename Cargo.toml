[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
inateck-bt-gatt = { path = "crates/lib" }
bluer = { version = "0.17", features = ["full"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
